set timeout=5
set default=0

insmod all_video
insmod gfxterm
terminal_output gfxterm

menuentry "@PRETTY@ (Live)" {
    linux /boot/vmlinuz quiet loglevel=3
    initrd /boot/initramfs.img
}

menuentry "@PRETTY@ (Live, console serial)" {
    linux /boot/vmlinuz console=tty0 console=ttyS0,115200
    initrd /boot/initramfs.img
}

menuentry "@PRETTY@ (shell de resgate)" {
    linux /boot/vmlinuz shiny.rescue
    initrd /boot/initramfs.img
}
