<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Fontes do desktop (perfil do Nix) + fontes do usuário -->
<fontconfig>
  <include ignore_missing="yes">/nix/var/nix/profiles/shiny-desktop/etc/fonts/conf.d</include>
  <dir>/nix/var/nix/profiles/shiny-desktop/share/fonts</dir>
  <dir>/usr/share/fonts</dir>
  <dir prefix="xdg">fonts</dir>
  <cachedir>/var/cache/fontconfig</cachedir>
  <cachedir prefix="xdg">fontconfig</cachedir>
</fontconfig>
