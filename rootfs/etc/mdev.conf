# Hotplug: carrega o driver de todo dispositivo novo (pendrive Wi-Fi etc.)
$MODALIAS=.*  0:0 660 @modprobe -qb "$MODALIAS"

# /etc/mdev.conf — permissões de dispositivos (devtmpfs cria os nós)
null        0:0 666
zero        0:0 666
full        0:0 666
random      0:0 666
urandom     0:0 444
tty         0:5 666
tty[0-9]+   0:5 620
ttyS[0-9]+  0:5 660
ptmx        0:5 666
fb[0-9]+    0:12 660
dri/.*      0:12 660
snd/.*      0:11 660
input/.*    0:13 660
sd[a-z].*   0:6 660
nvme.*      0:6 660
vd[a-z].*   0:6 660
sr[0-9]+    0:6 660
