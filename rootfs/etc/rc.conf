# /etc/rc.conf — configuração do sistema (estilo BSD)
# Os serviços ficam em /etc/rc.d e sobem na ordem de rc_services
# quando estão com <nome>_enable="YES".

keymap="br-abnt2"          # arquivo em /usr/share/keymaps (vazio = us)
timezone="BRT3"            # TZ POSIX (BRT3 = horário de Brasília)
hwclock_utc="YES"          # relógio do hardware em UTC

rc_services="udev syslogd klogd network wifi ntpd crond nixdaemon dbus elogind seatd"

syslogd_enable="YES"
klogd_enable="YES"
network_enable="YES"
network_interfaces="auto"  # "auto" = toda interface cabeada; ou ex.: "eth0 eth1"
wifi_enable="YES"         # Wi-Fi (redes salvas com o comando: wifi)
ntpd_enable="YES"
ntpd_server="pool.ntp.org"
crond_enable="YES"
nixdaemon_enable="YES"     # só roda se o Nix estiver instalado (pkg setup)

# Desktop KDE (instale com: sudo shiny-desktop install)
desktop_enable="NO"
desktop_autostart="YES"    # abre o Plasma ao entrar no tty1
udev_enable="NO"
dbus_enable="NO"
elogind_enable="NO"
seatd_enable="NO"
